  
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boys Council</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{padding:25px;text-align:center;background:#151d32}
h1{color:#65aaff}
main{max-width:750px;margin:35px auto;padding:15px}
.card{background:#19243b;padding:25px;border-radius:15px;margin-bottom:20px}
input,textarea{width:100%;padding:13px;margin:8px 0;background:#0b1020;color:white;border:1px solid #40516e;border-radius:8px}
button{padding:12px 20px;background:#3478f6;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>BOYS COUNCIL</h1>
<p>Манай зөвлөл • Манай ирээдүй</p>
</header>
<main>
<section class="card">
<h2>Тавтай морил!</h2>
<p>Boys Council-ийн албан ёсны цахим хуудас.</p>
</section>

<section class="card">
<h2>Нийтэд зориулсан мэдээлэл</h2>
<div id="posts">Мэдээлэл ачаалж байна...</div>
</section>

<section class="card">
<h2>Санал хүсэлт</h2>
<textarea id="feedback" placeholder="Санал хүсэлтээ бичнэ үү"></textarea>
<button onclick="sendFeedback()">Илгээх</button>
<p id="feedbackStatus"></p>
</section>

<section class="card">
<h2>Удирдлагын нэвтрэх хэсэг</h2>
<input id="phone" placeholder="Утасны дугаар">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Нэвтрэх</button>
<p id="loginStatus"></p>
</section>
</main>

<script>
const SUPABASE_URL = "https://bdguiubxteeeyuizcnwh.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_LK7BnVYtVwhsEY0YKoJI9Q_2dewa_Hi";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const phone=document.getElementById("phone").value.trim();
 const password=document.getElementById("password").value;
 const status=document.getElementById("loginStatus");

 status.textContent="Шалгаж байна...";
 const {data,error}=await db.auth.signInWithPassword({phone,password});

 if(error){
   status.textContent="Нэвтрэх боломжгүй: "+error.message;
   return;
 }

 const {data:admin,error:adminError}=await db
 .from("council_admins")
 .select("user_id")
 .eq("user_id",data.user.id)
 .maybeSingle();

 if(adminError || !admin){
   await db.auth.signOut();
   status.textContent="Танд удирдлагын эрх олгогдоогүй байна.";
   return;
 }

 status.textContent="Амжилттай нэвтэрлээ!";
}

async function loadPosts(){
 const {data,error}=await db.from("council_posts")
 .select("title,content")
 .order("created_at",{ascending:false});

 const area=document.getElementById("posts");

 if(error){
   area.textContent="Мэдээлэл одоогоор ачаалж чадсангүй.";
   return;
 }

 area.innerHTML="";
 data.forEach(post=>{
   const article=document.createElement("article");
   const title=document.createElement("h3");
   const content=document.createElement("p");
   title.textContent=post.title;
   content.textContent=post.content;
   article.append(title,content);
   area.append(article);
 });
}

async function sendFeedback(){
 const message=document.getElementById("feedback").value.trim();
 const status=document.getElementById("feedbackStatus");

 if(!message){
   status.textContent="Санал хүсэлтээ бичнэ үү.";
   return;
 }

 const {error}=await db.from("council_feedback")
 .insert({message});

 status.textContent=error
 ? "Илгээхэд алдаа гарлаа."
 : "Санал хүсэлт амжилттай илгээгдлээ!";

 if(!error) document.getElementById("feedback").value="";
}

if(SUPABASE_URL.startsWith("https://") &&
   SUPABASE_KEY.startsWith("sb_publishable_")){
 loadPosts();
}else{
 document.getElementById("posts").textContent=
 "Supabase холболтын мэдээллээ тохируулна уу.";
}
</script>
</body>
</html>
